name: Build ILs

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Verify and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant wrapper execute permission
        run: chmod +x ./gradlew

      - name: Static analysis (lint)
        run: ./gradlew :ILs:lintDebug --stacktrace

      - name: Unit tests
        run: ./gradlew :ILs:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :ILs:assembleDebug --stacktrace

      - name: Assemble release APK
        run: ./gradlew :ILs:assembleRelease --stacktrace

      - name: Compile instrumented tests
        run: ./gradlew :ILs:assembleDebugAndroidTest --stacktrace

      - name: Validate APK output
        run: |
          set -e
          test -s ILs/build/outputs/apk/debug/ILs-debug.apk
          test -s ILs/build/outputs/apk/release/ILs-release.apk
          mkdir -p dist
          cp ILs/build/outputs/apk/release/ILs-release.apk dist/ILs.apk
          cp ILs/build/outputs/apk/debug/ILs-debug.apk dist/ILs-debug.apk
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs dist/ILs.apk
          ls -l dist

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: ILs/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: ILs/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Upload ILs.apk
        uses: actions/upload-artifact@v4
        with:
          name: ILs
          path: dist/ILs.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ILs-debug
          path: dist/ILs-debug.apk
          if-no-files-found: error
          retention-days: 30

  instrumented:
    name: Instrumented UI tests (API 34 emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Emulator runs are slow, so they gate main and manual runs but not pull requests.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant wrapper execute permission
        run: chmod +x ./gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew :ILs:connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          path: ILs/build/reports/androidTests/connected
          if-no-files-found: ignore

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download ILs.apk
        uses: actions/download-artifact@v4
        with:
          name: ILs
          path: artifacts

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: ILs-debug
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/ILs.apk
            artifacts/ILs-debug.apk
          generate_release_notes: true
          body: |
            ILs — offline issue list with ranking, status and resolution tracking.

            - `ILs.apk` — install this one.
            - `ILs-debug.apk` — same app with debugging enabled.

            Android 13 (API 33) and newer. No permissions, no account, data stays on device.
